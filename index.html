<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparaison de flux GTFS</title>
<style>
  :root{
    --bg:#ffffff;--fg:#1a1d21;--muted:#5b6670;--line:#e3e7eb;--card:#f7f9fb;
    --accent:#1f6feb;--accent-fg:#fff;
    --crit:#d1242f;--imp:#e8590c;--mod:#b78103;--ok:#1a7f37;
    --crit-bg:#ffebe9;--imp-bg:#fff1e6;--mod-bg:#fff8e1;--ok-bg:#e9f6ec;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#2a2f36;--card:#161b22;
    --crit-bg:#3a1416;--imp-bg:#3a2410;--mod-bg:#332808;--ok-bg:#122117;
  }}
  *{box-sizing:border-box}
  body{font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--fg);background:var(--bg);margin:0}
  .wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 4rem}
  h1{font-size:1.4rem;margin:.2rem 0 .3rem}
  h2{font-size:1.05rem;margin:1.5rem 0 .6rem}
  .sub{color:var(--muted);margin:.2rem 0 1rem}
  .sources{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:680px){.sources{grid-template-columns:1fr}}
  .src{border:1px solid var(--line);border-radius:10px;padding:1rem;background:var(--card)}
  .src h3{margin:0 0 .5rem;font-size:.95rem}
  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:1rem;text-align:center;cursor:pointer;background:var(--bg)}
  .drop.over{border-color:var(--accent);background:var(--card)}
  .drop input{display:none}
  .fname{margin-top:.5rem;font-size:.85rem;color:var(--muted);word-break:break-all}
  label{display:block;font-size:.8rem;color:var(--muted);margin:.5rem 0 .2rem}
  input[type=text],select{width:100%;padding:.45rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:.9rem}
  .controls{display:flex;gap:1rem;align-items:flex-end;margin-top:1rem;flex-wrap:wrap}
  .controls>div{flex:1;min-width:220px}
  button{padding:.55rem 1.1rem;border:0;border-radius:7px;background:var(--accent);color:var(--accent-fg);font-size:.95rem;cursor:pointer}
  button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  .status{margin:1rem 0;min-height:1.4em}
  .hidden{display:none}
  .card{border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;background:var(--card);margin:.8rem 0}
  .badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:600}
  .b-critical{background:var(--crit-bg);color:var(--crit)} .b-important{background:var(--imp-bg);color:var(--imp)}
  .b-moderate{background:var(--mod-bg);color:var(--mod)} .b-ok{background:var(--ok-bg);color:var(--ok)}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  tr.click{cursor:pointer} tr.click:hover{background:var(--bg)}
  .pills{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
  .pill{padding:.25rem .6rem;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:.82rem}
  .pill.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin:.5rem 0 .8rem}
  .tab{padding:.45rem .8rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
  .tab.active{color:var(--fg);border-color:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
  .chg{color:var(--muted)} .chg b{color:var(--fg);font-weight:600}
  .pager{display:flex;gap:.6rem;align-items:center;margin:.7rem 0}
  .muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
  .delta-pos{color:var(--crit)} .delta-neg{color:var(--accent)}
</style></head>
<body><div class="wrap">
  <h1>Comparaison de flux GTFS</h1>
  <p class="sub">Tout se passe dans votre navigateur, hors ligne — aucun fichier n'est envoyé. Moteur validé contre le moteur Python.</p>

  <div class="sources">
    <div class="src">
      <h3>Source A</h3>
      <div class="drop" id="dropA"><span id="promptA">Glisser-déposer ou cliquer pour choisir un ZIP</span>
        <input type="file" id="fileA" accept=".zip"></div>
      <div class="fname" id="fnameA"></div>
      <label for="labelA">Libellé (facultatif)</label>
      <input type="text" id="labelA" placeholder="Par défaut : nom du fichier">
    </div>
    <div class="src">
      <h3>Source B</h3>
      <div class="drop" id="dropB"><span id="promptB">Glisser-déposer ou cliquer pour choisir un ZIP</span>
        <input type="file" id="fileB" accept=".zip"></div>
      <div class="fname" id="fnameB"></div>
      <label for="labelB">Libellé (facultatif)</label>
      <input type="text" id="labelB" placeholder="Par défaut : nom du fichier">
    </div>
  </div>

  <div class="controls">
    <div>
      <label for="profile">Profil de comparaison</label>
      <select id="profile">
        <option value="universal">🌐 Universel (standard GTFS, aucune normalisation)</option>
        <option value="zou_scolaire">🚌 ZOU ! scolaire (normalisation Pégase/SIBR)</option>
      </select>
    </div>
    <div style="flex:0">
      <button id="run">Comparer</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div id="results" class="hidden">
    <div id="overview"></div>
    <div id="detail"></div>
  </div>
</div>
<script type="module" src="./dist/app.bundle.js"></script>
</body></html>
